syntax = "proto3";
import "google/protobuf/empty.proto";
package contestStatus;

service contestStatusService {
  rpc notifyContestsAreOver (ContestsThatFinishedRequest) returns (google.protobuf.Empty);
}

message ContestsThatFinishedRequest {
  repeated Contest endContests = 1;
}
message Contest{
  int32 contestId = 1;
  repeated int32 roomIds = 2;
}