version: '3.8'

services:
  investo_meter-db:
    image: postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: investo_meter
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: investo_meter_db
    networks:
      - investo_meter_network
 
  # contests:
  #   image: contest-broadcast-microservice
  #   ports:
  #     - "3005:3005"
  #   depends_on:
  #     - investo_meter-db
  #   networks:
  #     - investo_meter_network
  
  hints:
    image: hints-microservice
    ports:
      - "50051:50051"
    networks:
      - investo_meter_network

networks:
  investo_meter_network:
    driver: bridge